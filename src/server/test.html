<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later
     Copyright (C) 2026 Maurizio Cammalleri
     janas-server --test: a chat page on the server itself, to see that the
     API works from a browser. It talks to /v1/chat/completions like any
     client: it keeps the conversation and sends it whole each time, and the
     server reads again only what is new. Nothing is loaded from elsewhere. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Janas-Chat Web</title>
<style>
:root {
  color-scheme: dark;
  --bg: #000; --panel: #121212; --line: #303030; --fg: #d0d0d0;
  --amber: #d7af5f; --grey: #8a8a8a; --red: #ff5f5f; --green: #87af87;
  --cmd: #87afaf;
  --md-accent: var(--amber); --md-code: var(--cmd); --md-code-bg: #262626;
  --md-dim: var(--grey); --md-line: #444; --md-pre-bg: var(--panel);
  --mono: ui-monospace, "DejaVu Sans Mono", "Cascadia Mono", Menlo, Consolas,
          monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 15px/1.5 var(--mono); display: flex; flex-direction: column;
       height: 100vh; height: 100dvh; }
header { display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
         padding: 12px 16px; border-bottom: 1px solid var(--line); }
.mascot { color: var(--amber); margin: 0; font: 9px/1 var(--mono);
          white-space: pre; }
.title { min-width: 0; }
.title h1 { margin: 0; font-size: 18px; color: var(--amber); }
.title p { margin: 2px 0 0; color: var(--grey); font-size: 12px;
           overflow-wrap: anywhere; }
details.settings { padding: 0 16px; border-bottom: 1px solid var(--line); }
details.settings summary { cursor: pointer; color: var(--cmd); padding: 8px 0; }
.field { margin: 0 0 10px; }
.field label { display: block; color: var(--amber); font-size: 13px; }
textarea, input, select, button { font: inherit; color: var(--fg);
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
textarea, input[type=password], input[type=number] { width: 100%;
  padding: 6px 8px; }
input[type=number] { max-width: 8em; }
main { flex: 1; overflow-y: auto; padding: 12px 16px; }
html, main, textarea, pre { scrollbar-color: #444 var(--bg); }
.msg { margin: 0 0 16px; }
.who { font-size: 13px; }
.who.user { color: var(--amber); }
.who.assistant { color: var(--cmd); }
<!--#include web/markdown.css-->
details.think { color: var(--grey); margin: 4px 0; }
details.think summary { cursor: pointer; font-size: 13px; }
details.think .text { border-left: 2px solid var(--line); padding-left: 8px; }
.stats { color: var(--grey); font-size: 12px; margin-top: 4px; }
.error { color: var(--red); white-space: pre-wrap; }
footer { border-top: 1px solid var(--line); padding: 10px 16px; }
#input { resize: vertical; min-height: 3em; max-height: 40vh; }
.buttons { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
button { cursor: pointer; padding: 6px 14px; }
button.go { color: var(--bg); background: var(--amber); border-color: var(--amber); }
button:disabled { opacity: 0.5; cursor: default; }
.hint { color: var(--grey); font-size: 12px; align-self: center; }
</style>
</head>
<body>
<header>
<pre class="mascot" aria-hidden="true">  ▄███████████▄
▄███████████████▄
███ ▄ █████ ▄ ███ ▄
███▄▄▄█████▄▄▄████
▀█████▄▀▀▀▄█████▀ ▀
  █████████████
 █ █ █ █ █ █ █ █
▀ ▀ ▀ ▀ ▀ ▀ ▀ ▀</pre>
<div class="title">
<h1>Janas-Chat Web</h1>
<p id="model">connecting…</p>
</div>
</header>

<details class="settings">
<summary>Settings</summary>
<div class="field"><label for="system">System message</label>
<textarea id="system" rows="2" placeholder="none"></textarea></div>
<div class="field"><label for="temp">Temperature</label>
<input id="temp" type="number" min="0" max="2" step="0.1" value="0.7"></div>
<div class="field"><label for="think">Reasoning</label>
<select id="think">
<option value="">the server's default</option>
<option value="on">on</option>
<option value="off">off</option>
</select></div>
<div class="field"><label for="key">API key, if the server asks for one</label>
<input id="key" type="password" autocomplete="off"></div>
</details>

<main id="chat" aria-live="polite"></main>

<footer>
<textarea id="input" rows="2" placeholder="Write a message"></textarea>
<div class="buttons">
<button id="send" class="go">Send</button>
<button id="stop" disabled>Stop</button>
<button id="new">New conversation</button>
<button id="sample" title="Show a text of ours with every mark this page knows, without asking the model">Markdown sample</button>
<button id="export" title="Download the conversation in Markdown">Export</button>
<button id="import" title="Take up a conversation from a file: Markdown, plain text, or one janas-chat saved">Import</button>
<input id="importFile" type="file" accept=".md,.markdown,.txt,.jsonl,text/*" hidden>
<select id="saved" title="The conversations kept in this browser"><option value="">Saved conversations</option></select>
<span class="hint">Enter sends, Shift+Enter starts a new line</span>
</div>
</footer>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const chat = $("chat"), input = $("input");
let history = [], busy = null;
/* the conversation's writing so far, for its average speed */
let wrote = 0, wroteSecs = 0, fastest = 0, slowest = 0;

try { $("key").value = sessionStorage.getItem("janas-key") || ""; } catch (e) {}
$("key").addEventListener("change", () => {
  try { sessionStorage.setItem("janas-key", $("key").value); } catch (e) {}
});

function headers() {
  const h = { "Content-Type": "application/json" };
  if ($("key").value) h.Authorization = "Bearer " + $("key").value;
  return h;
}

<!--#include web/md_entities.js-->
<!--#include web/md_parse.js-->
<!--#include web/markdown.js-->

function add(role) {
  const m = document.createElement("div");
  m.className = "msg";
  const who = document.createElement("div");
  who.className = "who " + role;
  who.textContent = role === "user" ? "you" : "Janas";
  m.appendChild(who);
  chat.appendChild(m);
  return m;
}

function scroll() { chat.scrollTop = chat.scrollHeight; }

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = "";
  const um = add("user"), ut = document.createElement("div");
  ut.className = "text";
  ut.textContent = text;
  um.appendChild(ut);
  history.push({ role: "user", content: text });

  const am = add("assistant");
  const think = document.createElement("details");
  think.className = "think";
  think.open = true;
  think.innerHTML = "<summary>reasoning</summary>";
  const tt = document.createElement("div");
  tt.className = "text";
  think.appendChild(tt);
  const at = document.createElement("div");
  at.className = "text";
  const st = document.createElement("div");
  st.className = "stats";
  am.appendChild(at);
  am.appendChild(st);
  scroll();

  const msgs = [];
  if ($("system").value.trim())
    msgs.push({ role: "system", content: $("system").value.trim() });
  const sent = history.map((m) => ({ role: m.role, content: m.content }));
  const body = { model: "janas", messages: msgs.concat(sent), stream: true,
                 stream_options: { include_usage: true },
                 temperature: Number($("temp").value) };
  if ($("think").value)
    body.reasoning_effort = $("think").value === "on" ? "medium" : "none";

  busy = new AbortController();
  $("send").disabled = true;
  $("stop").disabled = false;
  let reasoning = "", answer = "", usage = null, finish = "";
  const t0 = performance.now();
  let tFirst = 0;
  try {
    const r = await fetch("/v1/chat/completions", { method: "POST",
      headers: headers(), body: JSON.stringify(body), signal: busy.signal });
    if (!r.ok) {
      let msg = r.status + " " + r.statusText;
      try { msg = (await r.json()).error.message; } catch (e) {}
      throw new Error(msg);
    }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let cut;
      while ((cut = buf.indexOf("\n\n")) >= 0) {
        const ev = buf.slice(0, cut);
        buf = buf.slice(cut + 2);
        for (const line of ev.split("\n")) {
          /* the server says where the request waits while others run */
          if (line.startsWith(": queue ") && !answer && !reasoning)
            at.textContent = "Waiting: number " + line.slice(8) +
              " in the queue.";
          if (!line.startsWith("data: ")) continue;
          const data = line.slice(6);
          if (data === "[DONE]") continue;
          const d = JSON.parse(data);
          if (d.error) throw new Error(d.error.message);
          if (d.usage) usage = d.usage;
          const c = d.choices && d.choices[0];
          if (!c) continue;
          if (c.finish_reason) finish = c.finish_reason;
          const dl = c.delta || {};
          if (dl.reasoning_content) {
            if (!reasoning) am.insertBefore(think, at);
            reasoning += dl.reasoning_content;
            render(tt, mdStreaming(reasoning));
          }
          if (dl.content) {
            if (!tFirst) tFirst = performance.now();
            answer += dl.content;
            render(at, mdStreaming(answer));
          }
          scroll();
        }
      }
    }
    /* the whole reply drawn as it is: no mark closed for now any more */
    if (reasoning) render(tt, reasoning);
    if (answer) render(at, answer);
    history.push({ role: "assistant", content: answer, reasoning });
    keep();
    if (usage) {
      const j = usage.janas || {};
      const read = usage.prompt_tokens -
        ((usage.prompt_tokens_details || {}).cached_tokens || 0);
      const out = usage.completion_tokens;
      /* the engine's own time for the writing, without the reading */
      const secs = j.output_seconds || (performance.now() - t0) / 1000;
      wrote += out;
      wroteSecs += secs;
      /* a reply of a few tokens says more about the fixed costs than about
         the speed: min and max count the longer ones */
      const speed = out / secs;
      if (out >= 16) {
        fastest = Math.max(fastest, speed);
        slowest = slowest ? Math.min(slowest, speed) : speed;
      }
      const parts = [];
      if (j.context_size)
        parts.push("context " + j.context_used + " / " + j.context_size);
      parts.push("read " + read + (j.input_seconds !== undefined
        ? " in " + j.input_seconds.toFixed(2) + " s" : ""));
      parts.push("wrote " + out);
      /* this reply, then the conversation: min and max over the replies
         long enough to count, avg as all the tokens over all the time */
      const f = (x) => x.toFixed(1);
      parts.push("tok/s: last " + f(speed) +
        (slowest ? ", min " + f(slowest) + ", max " + f(fastest) : "") +
        ", avg " + f(wrote / wroteSecs));
      if (finish === "length") parts.push("cut at the length limit");
      st.textContent = parts.join(" · ");
    }
  } catch (e) {
    const err = document.createElement("div");
    err.className = "error";
    err.textContent = e.name === "AbortError" ? "stopped" : e.message;
    am.appendChild(err);
    if (answer) history.push({ role: "assistant", content: answer, reasoning });
    else history.pop(); /* the message goes with its failed reply */
    keep();
  }
  busy = null;
  $("send").disabled = false;
  $("stop").disabled = true;
  scroll();
  input.focus();
}

/* A text of our own with every mark render() knows: what a model writes
   cannot be trusted to show them all, or to write them right. It is shown,
   never sent: the model does not see it. */
const SAMPLE = [
  "# Heading 1", "## Heading 2", "### Heading 3", "#### Heading 4",
  "##### Heading 5", "###### Heading 6", "",
  "Plain text, **bold**, *italic*, _italic too_, ***bold italic***, " +
  "~~struck~~, `inline code`, H<sub>2</sub>O and x<sup>2</sup>, <kbd>Ctrl</kbd>.",
  "Left alone: snake_case_name, 2*3, a lone * and ~ too; \\*escaped\\* stars.",
  "A line break within a paragraph,", "shown as the model wrote it.", "",
  "- a bullet", "  - nested, with **bold** in it", "    1. and numbered inside",
  "- another", "- and a third", "",
  "3. a numbered list from 3", "4. and the next", "",
  "- [x] a task done", "- [ ] and one to do", "",
  "> A quote, with *italic* in it,", "> over two lines.", ">",
  "> > and one quoted inside it.", "",
  "| Left | Right | Centre |", "|:-----|------:|:------:|",
  "| alpha | 10 | *yes* |", "| beta \\| gamma | 200 | `no` |", "",
  "A [link written as Markdown](https://www.gnu.org/licenses/gpl-3.0.html \"GPL\"), " +
  "one by [reference][gpl], one written out: https://github.com/prabanta-dev/janas, " +
  "and www.commonmark.org - all ask before they open.", "",
  "[gpl]: https://www.gnu.org/licenses/gpl-3.0.html", "",
  "A formula: $e^{i\\pi} + 1 = 0$, money stays money: $5 to $10.", "",
  "---", "",
  "```c", "/* a fenced block: nothing in it is a mark */",
  "int main(void) { return 2*3; } // | not a table |", "> not a quote",
  "```", "",
  "    an indented block, code too", "",
  "<div>Raw HTML is shown as the text it is.</div>", "",
  "The end, in **bold**"
].join("\n");

$("sample").addEventListener("click", () => {
  const m = add("assistant");
  m.firstChild.textContent = "Markdown sample (not from the model)";
  const t = document.createElement("div");
  t.className = "text";
  m.appendChild(t);
  render(t, SAMPLE);
  scroll();
});
$("send").addEventListener("click", send);
$("stop").addEventListener("click", () => busy && busy.abort());
$("new").addEventListener("click", () => {
  if (busy) busy.abort();
  history = [];
  convId = "";
  wrote = wroteSecs = fastest = slowest = 0;
  chat.textContent = "";
  input.focus();
});

/*
 * Conversations kept, exported and taken up (issue #69). The conversation
 * is this page's: kept in this browser as it goes (the last 50), exported
 * in the Markdown janas-chat and the library write - a line that does not
 * show before each message, the reasoning folded - and read back from it,
 * from plain text ([user], [assistant]) or from a file janas-chat saved.
 */
let convId = "";
const ROLES = ["system", "user", "assistant", "tool"];
const HEADS = { system: "System", user: "User", assistant: "Assistant",
                tool: "Tool" };

function titleOf(msgs) {
  const q = msgs.find((m) => m.role === "user");
  if (!q) return "Conversation";
  const line = q.content.trim().split("\n")[0];
  return line.length > 60 ? line.slice(0, 60).replace(/\s+\S*$/, "") : line;
}

function savedAll() {
  try { return JSON.parse(localStorage.getItem("janas-chats") || "[]"); }
  catch (e) { return []; }
}

function keep() {
  if (!history.length) return;
  const all = savedAll().filter((c) => c.id !== convId);
  if (!convId) convId = Date.now().toString(36);
  all.unshift({ id: convId, title: titleOf(history), updated: Date.now(),
                system: $("system").value.trim(), messages: history });
  try { localStorage.setItem("janas-chats", JSON.stringify(all.slice(0, 50))); }
  catch (e) {}
  list();
}

function list() {
  const sel = $("saved");
  while (sel.options.length > 1) sel.remove(1);
  for (const c of savedAll()) {
    const o = document.createElement("option");
    o.value = c.id;
    o.textContent = c.title + " · " + new Date(c.updated).toLocaleString();
    sel.appendChild(o);
  }
}

/* A conversation in place of this one, shown as it went. */
function takeUp(msgs, system, id) {
  if (busy) busy.abort();
  chat.textContent = "";
  wrote = wroteSecs = fastest = slowest = 0;
  history = [];
  convId = id || "";
  if (system !== undefined) $("system").value = system;
  for (const m of msgs) {
    if (m.role === "system") { $("system").value = m.content; continue; }
    if (m.role === "tool") continue;
    history.push(m);
    const el = add(m.role === "user" ? "user" : "assistant");
    if (m.reasoning) {
      const d = document.createElement("details");
      d.className = "think";
      d.innerHTML = "<summary>reasoning</summary>";
      const t = document.createElement("div");
      t.className = "text";
      render(t, m.reasoning);
      d.appendChild(t);
      el.appendChild(d);
    }
    const t = document.createElement("div");
    t.className = "text";
    if (m.role === "user") t.textContent = m.content;
    else render(t, m.content);
    el.appendChild(t);
  }
  if (!id) keep();
  scroll();
  input.focus();
}

function toMarkdown() {
  const sys = $("system").value.trim();
  const msgs = (sys ? [{ role: "system", content: sys }] : []).concat(history);
  let s = "# " + titleOf(history) + "\n\n*" + new Date().toLocaleString() +
          ", " + $("model").textContent.split(" (")[0] + ", with Janas-LLM.*\n";
  for (const m of msgs) {
    s += "\n<!-- janas:" + m.role + " -->\n## " + HEADS[m.role] + "\n\n";
    if (m.reasoning)
      s += "<details><summary>Reasoning</summary>\n\n" + m.reasoning.trim() +
           "\n\n</details>\n\n";
    if (m.content) s += m.content.trim() + "\n";
  }
  return s;
}

/* The messages of a file: the saved form, the Markdown (by its markers,
   else by its headings), or plain text. */
function fromFile(text) {
  const lines = text.replace(/\r/g, "").split("\n");
  const first = lines.find((l) => l.trim());
  if (first && first.trim().startsWith("{") && first.includes('"janas_chat"'))
    return lines.slice(1).filter((l) => l.trim()).map((l) => JSON.parse(l))
      .map((m) => ({ role: m.role, content: m.text,
                     reasoning: m.reasoning || "" }));
  const marked = lines.some((l) => /^<!-- janas:(\w+) -->$/.test(l));
  const msgs = [];
  let cur = null;
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    let m = marked ? /^<!-- janas:(\w+) -->$/.exec(l)
                   : /^## (system|user|assistant|tool)\s*$/i.exec(l) ||
                     /^\[(system|user|assistant|tool)\]$/i.exec(l);
    if (m && ROLES.includes(m[1].toLowerCase())) {
      cur = { role: m[1].toLowerCase(), lines: [] };
      msgs.push(cur);
      if (marked && /^## /.test(lines[i + 1] || "")) i++;
    } else if (cur) cur.lines.push(l);
  }
  return msgs.map((m) => {
    let body = m.lines.join("\n"), reasoning = "";
    const d = /^\s*<details><summary>Reasoning<\/summary>\n([\s\S]*?)\n<\/details>\n?/.exec(body);
    if (d) { reasoning = d[1].trim(); body = body.slice(d[0].length); }
    body = body.replace(/\n<!-- janas:call [\s\S]*$/, "");
    return { role: m.role, content: body.trim(), reasoning };
  });
}

$("export").addEventListener("click", () => {
  if (!history.length) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([toMarkdown()],
                                        { type: "text/markdown" }));
  a.download = titleOf(history).replace(/[^\p{L}\p{N}._-]+/gu, "-")
                 .replace(/^-+|-+$/g, "") + ".md";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$("import").addEventListener("click", () => $("importFile").click());
$("importFile").addEventListener("change", async () => {
  const f = $("importFile").files[0];
  $("importFile").value = "";
  if (!f) return;
  let msgs = [];
  try { msgs = fromFile(await f.text()); } catch (e) {}
  if (!msgs.length) {
    const el = add("assistant");
    el.firstChild.textContent = "Import";
    const t = document.createElement("div");
    t.className = "error";
    t.textContent = f.name + ": no conversation found in it";
    el.appendChild(t);
    return;
  }
  takeUp(msgs, "");
});
$("saved").addEventListener("change", () => {
  const c = savedAll().find((x) => x.id === $("saved").value);
  $("saved").value = "";
  if (c) takeUp(c.messages, c.system, c.id);
});
list();
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send();
  }
});

fetch("/v1/models", { headers: headers() })
  .then((r) => r.json())
  .then((d) => {
    const m = d.data && d.data[0];
    $("model").textContent = m ? m.description || m.id
                               : (d.error ? d.error.message : "no model");
    /* Janas presents itself, as janas-chat does: the text is in Settings,
       to read and to change */
    if (m && m.janas && m.janas.system && !$("system").value)
      $("system").value = m.janas.system;
  })
  .catch(() => { $("model").textContent = "the server does not answer"; });
input.focus();
</script>
</body>
</html>
