<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Where Qwen3-Next-80B's 48.4 GB go on a laptop with 32 GB of memory</title>
<desc id="d">The file on the SSD: 1.6 GB that every token needs and 46.8 GB of experts. In memory: the 1.6 GB, an expert cache of 21.4 GiB, and the rest of the memory for the system and the context. A token asks for 480 experts; 94.8% were found in the cache, about 25 read from the SSD, about 50 MB.</desc>
<style>
  .bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.mut{fill:#898781}
  .res{fill:#2a78d6}.exp{fill:#86b6ef}.cache{fill:#1c5cab}.free{fill:#e1e0d9}.read{fill:#eb6834}.line{stroke:#898781}.on{fill:#ffffff}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19}.ink{fill:#f0efec}.ink2{fill:#c3c2b7}
    .res{fill:#3987e5}.exp{fill:#256abf}.cache{fill:#86b6ef}.free{fill:#383835}.read{fill:#d95926}.on{fill:#0b0b0b}
  }
</style>
<rect class="bg" width="760" height="330" rx="10"/>
<text class="ink" x="24" y="34" font-size="17" font-weight="600">Qwen3-Next-80B, 48.4 GB, on a laptop with 32 GB</text>
<text class="ink2" x="24" y="56" font-size="13">The widths are to scale: 100 px for 7 GB.</text>
<!-- SSD: 48.4 GB -> 691 px; resident 1.6 GB -> 23 px; experts 46.8 -> 669 -->
<text class="ink" x="24" y="94" font-size="14" font-weight="600">On the SSD: the file</text>
<rect class="res" x="24" y="104" width="23" height="34" rx="3"/>
<rect class="exp" x="49" y="104" width="666" height="34" rx="3"/>
<text class="ink" x="382" y="126" font-size="13" text-anchor="middle">46.8 GB of experts: 48 layers × 512, 2.04 MB each</text>
<text class="ink2" x="24" y="156" font-size="12">1.6 GB every token needs: attention, the recurrent layers, the shared experts, the embeddings</text>
<!-- memory: 32 GB -> 457 px; resident 23; cache 21.4 GiB = 23.0 GB -> 329; the rest 105 -->
<text class="ink" x="24" y="200" font-size="14" font-weight="600">In memory: 32 GB</text>
<rect class="res" x="24" y="210" width="23" height="34" rx="3"/>
<rect class="cache" x="49" y="210" width="327" height="34" rx="3"/>
<rect class="free" x="378" y="210" width="103" height="34" rx="3"/>
<text class="on" x="212" y="232" font-size="13" text-anchor="middle">the expert cache, 21.4 GiB</text>
<text class="ink2" x="430" y="262" font-size="12" text-anchor="middle">the system, the desktop,</text>
<text class="ink2" x="430" y="277" font-size="12" text-anchor="middle">the context</text>
<!-- the token -->
<text class="ink" x="510" y="200" font-size="14" font-weight="600">A token</text>
<text class="ink2" x="510" y="222" font-size="13">asks for 48 × 10 = 480 experts:</text>
<rect class="cache" x="510" y="232" width="12" height="12" rx="2"/>
<text class="ink2" x="528" y="243" font-size="13">94.8% found in the cache</text>
<rect class="read" x="510" y="252" width="12" height="12" rx="2"/>
<text class="ink2" x="528" y="263" font-size="13">about 25 read from the SSD,</text>
<text class="ink2" x="528" y="279" font-size="13">about 50 MB</text>
<text class="mut" x="24" y="312" font-size="11">Measured on 21 October 2026 (janas-bench, 20 threads, the cache's share of the experts asked for). The file's sizes: jns_check.</text>
</svg>
