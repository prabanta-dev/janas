<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">A token's layers, without and with reading ahead</title>
<desc id="d">Without reading ahead, each layer computes its attention, then waits while the experts missing from the cache are read from the SSD, then computes its experts. With reading ahead, the next layer's router is applied early, and its missing experts are read from the SSD while the current layer computes, so the waits shrink or vanish. A schematic, not to scale.</desc>
<style>
  .bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.mut{fill:#898781}
  .att{fill:#2a78d6}.exp{fill:#1baf7a}.wait{fill:#e1e0d9}.read{fill:#eb6834}.axis{stroke:#c3c2b7}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19}.ink{fill:#f0efec}.ink2{fill:#c3c2b7}
    .att{fill:#3987e5}.exp{fill:#199e70}.wait{fill:#383835}.read{fill:#d95926}.axis{stroke:#383835}
  }
</style>
<rect class="bg" width="760" height="330" rx="10"/>
<text class="ink" x="24" y="34" font-size="17" font-weight="600">One token through three layers: where the disk's time goes</text>
<text class="ink2" x="24" y="56" font-size="13">A schematic, not to scale.</text>
<!-- legend -->
<rect class="att" x="24" y="70" width="12" height="12" rx="2"/><text class="ink2" x="42" y="81" font-size="12">attention and the router</text>
<rect class="exp" x="200" y="70" width="12" height="12" rx="2"/><text class="ink2" x="218" y="81" font-size="12">the experts computed</text>
<rect class="wait" x="360" y="70" width="12" height="12" rx="2"/><text class="ink2" x="378" y="81" font-size="12">waiting for the disk</text>
<rect class="read" x="510" y="70" width="12" height="12" rx="2"/><text class="ink2" x="528" y="81" font-size="12">experts read from the SSD</text>
<!-- without -->
<text class="ink" x="24" y="118" font-size="14" font-weight="600">Without reading ahead</text>
<text class="ink2" x="24" y="144" font-size="12">CPU</text>
<text class="ink2" x="24" y="172" font-size="12">SSD</text>
<line class="axis" x1="70" y1="180" x2="736" y2="180"/>
<rect class="att" x="70" y="130" width="60" height="20" rx="2"/>
<rect class="wait" x="130" y="130" width="70" height="20" rx="2"/>
<rect class="exp" x="200" y="130" width="60" height="20" rx="2"/>
<rect class="read" x="130" y="158" width="70" height="20" rx="2"/>
<rect class="att" x="262" y="130" width="60" height="20" rx="2"/>
<rect class="wait" x="322" y="130" width="70" height="20" rx="2"/>
<rect class="exp" x="392" y="130" width="60" height="20" rx="2"/>
<rect class="read" x="322" y="158" width="70" height="20" rx="2"/>
<rect class="att" x="454" y="130" width="60" height="20" rx="2"/>
<rect class="wait" x="514" y="130" width="70" height="20" rx="2"/>
<rect class="exp" x="584" y="130" width="60" height="20" rx="2"/>
<rect class="read" x="514" y="158" width="70" height="20" rx="2"/>
<text class="ink2" x="100" y="198" font-size="11" text-anchor="middle">layer 1</text>
<text class="ink2" x="292" y="198" font-size="11" text-anchor="middle">layer 2</text>
<text class="ink2" x="484" y="198" font-size="11" text-anchor="middle">layer 3</text>
<!-- with -->
<text class="ink" x="24" y="232" font-size="14" font-weight="600">With reading ahead: the next layer's router applied early</text>
<text class="ink2" x="24" y="258" font-size="12">CPU</text>
<text class="ink2" x="24" y="286" font-size="12">SSD</text>
<line class="axis" x1="70" y1="294" x2="736" y2="294"/>
<rect class="att" x="70" y="244" width="60" height="20" rx="2"/>
<rect class="wait" x="130" y="244" width="70" height="20" rx="2"/>
<rect class="exp" x="200" y="244" width="60" height="20" rx="2"/>
<rect class="read" x="130" y="272" width="70" height="20" rx="2"/>
<rect class="read" x="202" y="272" width="70" height="20" rx="2"/>
<rect class="att" x="262" y="244" width="60" height="20" rx="2"/>
<rect class="exp" x="322" y="244" width="60" height="20" rx="2"/>
<rect class="read" x="324" y="272" width="70" height="20" rx="2"/>
<rect class="att" x="384" y="244" width="60" height="20" rx="2"/>
<rect class="exp" x="444" y="244" width="60" height="20" rx="2"/>
<text class="ink2" x="100" y="312" font-size="11" text-anchor="middle">layer 1</text>
<text class="ink2" x="292" y="312" font-size="11" text-anchor="middle">layer 2</text>
<text class="ink2" x="414" y="312" font-size="11" text-anchor="middle">layer 3</text>
<text class="ink" x="520" y="258" font-size="12">the reads of layers 2 and 3</text>
<text class="ink" x="520" y="274" font-size="12">overlap the layer before</text>
</svg>
