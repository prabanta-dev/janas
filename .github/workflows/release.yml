# Copyright (C) 2026 Maurizio Cammalleri
#
# The binary packages of Janas for Linux x86-64 and Linux on 64-bit ARM:
# each built on Ubuntu 22.04 on a machine of its kind, so that it runs with
# the C library of Ubuntu 22.04, Debian 12 and later; tested; packed as
# janas-linux-x86_64.tar.gz and janas-linux-aarch64.tar.gz with the SHA-256
# of every file. The one for Windows x86-64 is built from the same sources with
# MinGW-w64 on Linux, tested on a Windows machine of GitHub's and packed as
# janas-windows-x86_64.zip, attached to the same release, as is macOS's
# (janas-macos-arm64.tar.gz, built on a Mac of GitHub's). Every package is
# made by dist/pack.sh. A tag v* publishes it as that tag's release (the name never
# changes, so releases/latest/download/janas-linux-x86_64.tar.gz is always
# the newest); run by hand, it only builds the package and keeps it as an
# artifact of the run. The shaders' compiler and the Vulkan headers are
# Khronos's own, at fixed versions: Ubuntu 22.04's are from 2022 (the
# compiler built from its sources on ARM, where Khronos builds none).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GLSLANG_VERSION: 16.6.0
  GLSLANG_SHA256: 2c34071f56ecf39d16233294d3739cf43f981fd39080f2fd9dccb782101191ce
  GLSLANG_COMMIT: e1b562a8bed273a02f30b59b66a5d499793cede5
  LLVM_MINGW_VERSION: '20261104'
  LLVM_MINGW_SHA256: 919380403de87dca3c581c2053230cd298af5e891286628ba0613b7fed370926
  VULKAN_HEADERS_TAG: vulkan-sdk-1.4.363.0
  VULKAN_HEADERS_COMMIT: 6802bb4733b63ed5efd3adb308a6c885ef180ea1

jobs:
  # Linux on x86-64 and on 64-bit ARM, each built and tested on a machine
  # of its own kind (Ubuntu 22.04: its C library), packed the same way
  linux:
    strategy:
      # each machine's build and tests to their end, whatever the other's
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE: janas-linux-${{ matrix.arch }}
      DIAG: janas-diag-linux-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      - name: The shaders' compiler and the Vulkan headers
        run: |
          set -euo pipefail
          # clang and lld: the CUDA and HIP kernels (build.sh)
          export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a
          sudo -E apt-get update -q
          sudo -E apt-get install -y -q --no-install-recommends clang lld
          mkdir -p "$RUNNER_TEMP/khronos"
          cd "$RUNNER_TEMP/khronos"
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            curl -fsSL -o glslang.tar.gz \
              "https://github.com/KhronosGroup/glslang/releases/download/$GLSLANG_VERSION/glslang-$GLSLANG_VERSION-linux-x86_64-release.tar.gz"
            echo "$GLSLANG_SHA256  glslang.tar.gz" | sha256sum -c -
            mkdir glslang && tar xzf glslang.tar.gz -C glslang
          else
            # Khronos builds none for ARM: the same version from its tag's
            # sources (the compiler alone, no optimizer)
            git clone -q --depth 1 --branch "$GLSLANG_VERSION" \
              https://github.com/KhronosGroup/glslang.git glslang-src
            test "$(git -C glslang-src rev-parse HEAD)" = "$GLSLANG_COMMIT"
            cmake -S glslang-src -B glslang-build -DCMAKE_BUILD_TYPE=Release \
              -DENABLE_OPT=OFF -DGLSLANG_TESTS=OFF -DENABLE_GLSLANG_BINARIES=ON \
              -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/khronos/glslang" >/dev/null
            cmake --build glslang-build -j "$(nproc)" --target install >/dev/null
          fi
          echo "$RUNNER_TEMP/khronos/glslang/bin" >> "$GITHUB_PATH"
          git clone -q --depth 1 --branch "$VULKAN_HEADERS_TAG" \
            https://github.com/KhronosGroup/Vulkan-Headers.git
          test "$(git -C Vulkan-Headers rev-parse HEAD)" = "$VULKAN_HEADERS_COMMIT"
          echo "CPATH=$RUNNER_TEMP/khronos/Vulkan-Headers/include" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -euo pipefail
          glslangValidator --version | head -1
          ./build.sh release build 2>&1 | tee build.log
          # the GPU's support must be in: without it the package would
          # run on the CPU alone without a word
          if grep -q "building without GPU support" build.log; then
            echo "the build left the GPU out"; exit 1
          fi
          # nor NVIDIA's and AMD's own ways to their cards
          if grep -qE "building without (CUDA|HIP)" build.log; then
            echo "the build left CUDA or HIP out"; exit 1
          fi

      - name: Test
        run: ./build.sh release test

      - name: Pack
        # the package and the GPU's checks alone (dist/pack.sh, the same
        # for every system)
        run: bash dist/pack.sh linux ${{ matrix.arch }}

      - name: Keep the package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: |
            ${{ env.PACKAGE }}.tar.gz
            ${{ env.PACKAGE }}.tar.gz.sha256
            ${{ env.DIAG }}.tar.gz
            ${{ env.DIAG }}.tar.gz.sha256

  # the release, once both Linux packages are made: the x86-64 and the ARM
  # one attached together (Windows's added by windows-package)
  linux-release:
    needs: linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: janas-linux-*
          merge-multiple: true

      - name: Publish the release (a tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            janas-linux-x86_64.tar.gz janas-linux-x86_64.tar.gz.sha256 \
            janas-diag-linux-x86_64.tar.gz janas-diag-linux-x86_64.tar.gz.sha256 \
            janas-linux-aarch64.tar.gz janas-linux-aarch64.tar.gz.sha256 \
            janas-diag-linux-aarch64.tar.gz janas-diag-linux-aarch64.tar.gz.sha256 \
            --title "Janas $GITHUB_REF_NAME" \
            --notes "Janas for Linux x86-64 (Ubuntu 22.04, Debian 12 and later): janas-linux-x86_64.tar.gz; for Linux on 64-bit ARM (the same systems, Raspberry Pi OS 64-bit): janas-linux-aarch64.tar.gz; for Windows 10 and 11 x86-64: janas-windows-x86_64.zip, on 64-bit ARM: janas-windows-aarch64.zip; for macOS 14 and later on Apple Silicon, the CPU alone: janas-macos-arm64.tar.gz (added once GitHub's Mac has built it; not signed: its README says how to open it). Only the GPU checks (vkcheck, gpu_check), to tell whether a GPU computes what the CPU does: janas-diag-linux-x86_64.tar.gz, janas-diag-linux-aarch64.tar.gz, janas-diag-windows-x86_64.zip. Unpack it and start: janas-get list, then janas-chat <model>. What changed: ChangeLog.md. The SHA-256 of every file: SHA256SUMS in the package."

  # Windows x86-64: the same sources built with MinGW-w64 on Linux (a
  # newer Ubuntu: the C library does not matter for Windows, the MinGW
  # headers do), then tested on Windows, then packed.
  windows-build:
    # x86-64 with MinGW-w64's gcc, 64-bit ARM with llvm-mingw's clang
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: MinGW-w64 (or llvm-mingw), the shaders' compiler and the Vulkan headers
        run: |
          set -euo pipefail
          # no question may wait for an answer (needrestart asks one)
          export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a
          sudo -E apt-get update -q
          sudo -E apt-get install -y -q --no-install-recommends \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 clang lld
          mkdir -p "$RUNNER_TEMP/khronos"
          cd "$RUNNER_TEMP/khronos"
          if [ "${{ matrix.arch }}" = aarch64 ]; then
            curl -fsSL -o llvm-mingw.tar.xz \
              "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64.tar.xz"
            echo "$LLVM_MINGW_SHA256  llvm-mingw.tar.xz" | sha256sum -c -
            tar xJf llvm-mingw.tar.xz
            T="$PWD/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64/bin"
            # by full paths: its lld must not stand in for the system's,
            # which links the HIP kernels
            { echo "CC=$T/aarch64-w64-mingw32-clang"
              echo "AR=$T/aarch64-w64-mingw32-ar"
              echo "WINDRES=$T/aarch64-w64-mingw32-windres"
              echo "OBJDUMP=$T/llvm-objdump"
              echo "JANAS_CPU=aarch64"; } >> "$GITHUB_ENV"
          else
            echo "OBJDUMP=x86_64-w64-mingw32-objdump" >> "$GITHUB_ENV"
          fi
          curl -fsSL -o glslang.tar.gz \
            "https://github.com/KhronosGroup/glslang/releases/download/$GLSLANG_VERSION/glslang-$GLSLANG_VERSION-linux-x86_64-release.tar.gz"
          echo "$GLSLANG_SHA256  glslang.tar.gz" | sha256sum -c -
          mkdir glslang && tar xzf glslang.tar.gz -C glslang
          echo "$RUNNER_TEMP/khronos/glslang/bin" >> "$GITHUB_PATH"
          git clone -q --depth 1 --branch "$VULKAN_HEADERS_TAG" \
            https://github.com/KhronosGroup/Vulkan-Headers.git
          test "$(git -C Vulkan-Headers rev-parse HEAD)" = "$VULKAN_HEADERS_COMMIT"
          echo "CPATH=$RUNNER_TEMP/khronos/Vulkan-Headers/include" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -euo pipefail
          JANAS_OS=windows ./build.sh release build 2>&1 | tee build.log
          if grep -q "building without GPU support" build.log; then
            echo "the build left the GPU out"; exit 1
          fi
          # nor NVIDIA's and AMD's own ways to their cards
          if grep -qE "building without (CUDA|HIP)" build.log; then
            echo "the build left CUDA or HIP out"; exit 1
          fi
          # nothing but Windows's own DLLs (its C runtime too: msvcrt, or
          # the universal one's api-ms-win-crt-*)
          for f in bin/${{ matrix.arch }}-windows/*.exe bin/${{ matrix.arch }}-windows/*.dll; do
            "$OBJDUMP" -p "$f" | grep "DLL Name" |
              grep -v -i -E 'kernel32|msvcrt|api-ms-win-crt-|ws2_32|bcrypt|crypt32|powrprof|advapi32|iphlpapi|ole32|wevtapi|wlanapi|shell32|psapi|user32|gdi32|setupapi' &&
              { echo "$f needs a DLL Windows does not have"; exit 1; } || true
          done

      - uses: actions/upload-artifact@v7
        with:
          name: windows-bin-${{ matrix.arch }}
          path: bin/${{ matrix.arch }}-windows/

  windows-test:
    needs: windows-build
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
          - arch: aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: windows-bin-${{ matrix.arch }}
          path: bin/${{ matrix.arch }}-windows

      - name: Test
        shell: pwsh
        run: |
          $failed = @()
          foreach ($t in Get-ChildItem bin\${{ matrix.arch }}-windows\test_*.exe) {
            Write-Host "RUN $($t.Name)"
            & $t.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $t.Name }
          }
          if ($failed.Count -gt 0) { Write-Host "failed: $failed"; exit 1 }
          # the mark windows-package looks for: this processor's tests passed
          Set-Content -Path tested.txt -Value "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-tested-${{ matrix.arch }}
          path: tested.txt

  windows-package:
    needs: [linux-release, windows-build, windows-test]
    # each processor's package when its own tests passed (the mark of
    # windows-test), whatever the other's; run by hand the release is not
    # made (linux-release skipped) and the packages are kept all the same
    if: always() && needs.linux-release.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WPACKAGE: janas-windows-${{ matrix.arch }}
      WDIAG: janas-diag-windows-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: windows-tested-${{ matrix.arch }}

      - uses: actions/download-artifact@v7
        with:
          name: windows-bin-${{ matrix.arch }}
          path: bin/${{ matrix.arch }}-windows

      - name: Pack
        run: bash dist/pack.sh windows ${{ matrix.arch }}

      - name: Keep the package (run by hand)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.WPACKAGE }}
          path: |
            ${{ env.WPACKAGE }}.zip
            ${{ env.WPACKAGE }}.zip.sha256
            ${{ env.WDIAG }}.zip
            ${{ env.WDIAG }}.zip.sha256

      - name: Add it to the release (a tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "$WPACKAGE.zip" "$WPACKAGE.zip.sha256" \
            "$WDIAG.zip" "$WDIAG.zip.sha256"

  # macOS on Apple Silicon: built, tested and packed on a Mac of GitHub's,
  # Apple's GPU through Metal checked against the CPU bit for bit
  # (gpu_check); its package added to the release once made, so
  # that GitHub's Macs, often kept waiting, never hold the others' release
  # back. build.sh wants bash 4 and GNU's tools: Homebrew's, ahead in PATH.
  macos:
    needs: linux-release
    if: always() && needs.linux-release.result != 'failure'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MPACKAGE: janas-macos-arm64
    steps:
      - uses: actions/checkout@v7

      - name: bash 4 and GNU's tools
        run: |
          set -euo pipefail
          brew install bash coreutils gnu-sed findutils gawk grep glslang vulkan-headers
          P=$(brew --prefix)
          for d in coreutils gnu-sed findutils gawk grep; do
            echo "$P/opt/$d/libexec/gnubin" >> "$GITHUB_PATH"
          done
          echo "$P/bin" >> "$GITHUB_PATH"
          # the GPU's code is built with Vulkan's headers (gpu.c), Metal
          # being what macOS runs: Homebrew's headers for Apple's clang
          echo "CPATH=$P/include" >> "$GITHUB_ENV"

      - name: Build
        run: bash ./build.sh release build

      - name: Test
        run: bash ./build.sh release test

      - name: Metal against the CPU
        run: JANAS_GPU=1 bin/arm64-darwin/gpu_check

      - name: Pack
        run: bash dist/pack.sh darwin arm64

      - name: Keep the package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MPACKAGE }}
          path: |
            ${{ env.MPACKAGE }}.tar.gz
            ${{ env.MPACKAGE }}.tar.gz.sha256

      - name: Add it to the release (a tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "$MPACKAGE.tar.gz" "$MPACKAGE.tar.gz.sha256"

  # The wiki, made from the same pages as the repository: README.md becomes
  # Home, each docs/*.md a page named after its title. It is never edited
  # by hand: every tag writes it again whole, so it cannot drift from the
  # release. Links between the pages become the wiki's own; links to the
  # sources point to the tag's files on GitHub.
  wiki:
    needs: linux-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Write the wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/wiki"
          git clone -q "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.wiki.git" "$W"
          find "$W" -maxdepth 1 -name '*.md' -delete
          BLOB="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME"
          RAW="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME"
          # the order of the README's list, then any page not in it
          ORDER="features models chat library serving code-completion tools hardware"
          for f in docs/*.md; do
            n=$(basename "$f" .md)
            case " $ORDER " in *" $n "*) ;; *) ORDER="$ORDER $n" ;; esac
          done
          # a page's name: its title, spaces made dashes
          PAGES=()
          for n in $ORDER; do
            t=$(head -1 "docs/$n.md" | sed -E 's/^# //')
            PAGES+=("$n=${t// /-}")
          done
          names() {  # @@name@@ -> the page's name
            for p in "${PAGES[@]}"; do
              printf 's#@@%s@@#%s#g\n' "${p%%=*}" "${p#*=}"
            done
          }
          # Home: docs/x.md -> the page, other files -> the tag's sources
          # pictures (<img src=...>) -> the tag's files themselves
          sed -E -e 's#\]\(docs/([a-z-]+)\.md(\#[^)]*)?\)#](@@\1@@\2)#g' \
                 -e "s#\\]\\(([A-Za-z][^):@]*)\\)#](${BLOB}/\\1)#g" \
                 -e "s#src=\"([A-Za-z][^\":]*)\"#src=\"${RAW}/\\1\"#g" README.md |
            sed -E -f <(names) > "$W/Home.md"
          for n in $ORDER; do
            t=$(head -1 "docs/$n.md" | sed -E 's/^# //')
            tail -n +2 "docs/$n.md" | sed -E '1{/^$/d}' |
              sed -E -e 's#\]\(\.\./README\.md(\#[^)]*)?\)#](Home\1)#g' \
                     -e "s#\\]\\(\\.\\./([^)]*)\\)#](${BLOB}/\\1)#g" \
                     -e 's#\]\(([a-z-]+)\.md(\#[^)]*)?\)#](@@\1@@\2)#g' |
              sed -E -f <(names) > "$W/${t// /-}.md"
          done
          # no link may be left pointing at a file the wiki does not have
          if grep -n -E '\]\([^):]*\.md(#[^)]*)?\)|@@' "$W"/*.md; then
            echo "a link the wiki cannot follow"; exit 1
          fi
          {
            echo "**[Home](Home)**"
            echo
            for p in "${PAGES[@]}"; do
              v=${p#*=}
              echo "- [${v//-/ }]($v)"
            done
          } > "$W/_Sidebar.md"
          echo "Written from the repository's README.md and docs/ at [$GITHUB_REF_NAME](https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME): changes go there, not here." > "$W/_Footer.md"
          cd "$W"
          git add -A
          if git diff --cached --quiet; then echo "the wiki is already up to date"; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "The wiki of $GITHUB_REF_NAME"
          git push -q origin HEAD
