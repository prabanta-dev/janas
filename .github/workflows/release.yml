#
# The binary package of Janas for Linux x86-64: built on Ubuntu 22.04, so
# that it runs with the C library of Ubuntu 22.04, Debian 12 and later;
# tested; packed as janas-linux-x86_64.tar.gz with the SHA-256 of every
# file. The one for Windows x86-64 is built from the same sources with
# MinGW-w64 on Linux, tested on a Windows machine of GitHub's and packed as
# janas-windows-x86_64.zip, attached to the same release. A tag v* publishes it as that tag's release (the name never
# changes, so releases/latest/download/janas-linux-x86_64.tar.gz is always
# the newest); run by hand, it only builds the package and keeps it as an
# artifact of the run. The shaders' compiler and the Vulkan headers are
# Khronos's own, at fixed versions: Ubuntu 22.04's are from 2022.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GLSLANG_VERSION: 16.6.0
  GLSLANG_SHA256: 2c34071f56ecf39d16233294d3739cf43f981fd39080f2fd9dccb782101191ce
  VULKAN_HEADERS_TAG: vulkan-sdk-1.4.363.0
  VULKAN_HEADERS_COMMIT: 6802bb4733b63ed5efd3adb308a6c885ef180ea1
  PACKAGE: janas-linux-x86_64
  DIAG: janas-diag-linux-x86_64

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: The shaders' compiler and the Vulkan headers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/khronos"
          cd "$RUNNER_TEMP/khronos"
          curl -fsSL -o glslang.tar.gz \
            "https://github.com/KhronosGroup/glslang/releases/download/$GLSLANG_VERSION/glslang-$GLSLANG_VERSION-linux-x86_64-release.tar.gz"
          echo "$GLSLANG_SHA256  glslang.tar.gz" | sha256sum -c -
          mkdir glslang && tar xzf glslang.tar.gz -C glslang
          echo "$RUNNER_TEMP/khronos/glslang/bin" >> "$GITHUB_PATH"
          git clone -q --depth 1 --branch "$VULKAN_HEADERS_TAG" \
            https://github.com/KhronosGroup/Vulkan-Headers.git
          test "$(git -C Vulkan-Headers rev-parse HEAD)" = "$VULKAN_HEADERS_COMMIT"
          echo "CPATH=$RUNNER_TEMP/khronos/Vulkan-Headers/include" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -euo pipefail
          glslangValidator --version | head -1
          ./build.sh release build 2>&1 | tee build.log
          # the GPU's support must be in: without it the package would
          # run on the CPU alone without a word
          if grep -q "building without GPU support" build.log; then
            echo "the build left the GPU out"; exit 1
          fi

      - name: Test
        run: ./build.sh release test

      - name: Pack
        run: |
          set -euo pipefail
          B=bin/x86_64-linux
          P="$PACKAGE/janas"
          mkdir -p "$P/services" "$P/lib" "$P/include/janas" "$P/docs" "$P/node"
          for f in janas-chat janas-server janas-get janas-setup janas-bench janas-mcp \
                   gguf2jns jns_planes hf2jns_mtp jns_check vkcheck gpu_check; do
            install -m 755 "$B/$f" "$P/"
          done
          for s in src/services/*/; do
            s=$(basename "$s")
            [ "$s" = common ] && continue
            install -m 755 "$B/janas-$s" "$P/services/"
            # each service's page, its links made to point beside it
            install -m 644 "src/services/$s/README.md" "$P/services/janas-$s.md"
          done
          sed -E 's#\(([a-z]+)/README\.md\)#(janas-\1.md)#g' \
            src/services/README.md > "$P/services/README.md"
          install -m 755 "$B/libjanas_llm.so" "$B/libjanas_mcp.so" "$P/lib/"
          # the library as a module for Node.js, with its types for TypeScript
          install -m 755 "$B/janas.node" "$P/node/"
          install -m 644 "$B/janas.d.ts" "$P/node/"
          install -m 644 include/janas/* "$P/include/janas/"
          install -m 644 docs/*.md "$P/docs/"
          install -m 644 dist/README.md "$P/README.md"
          install -m 644 LICENSE ChangeLog.md MODELS.md "$P/"
          # nothing but programs, libraries and text: no script of any kind
          if find "$P" -type f \( -name '*.sh' -o -name '*.py' \) | grep -q .; then
            echo "a script in the package"; exit 1
          fi
          # the module, as packed, loads where the runner has Node.js
          if command -v node >/dev/null; then
            node -e 'const j = require(process.argv[1]);
              if (j.abiVersion() !== 1) process.exit(1);
              console.log("janas.node " + j.version + " loads in Node " + process.version)' \
              "$(realpath "$P/node/janas.node")"
          fi
          # the newest C library the programs ask for
          find "$P" -type f -perm -u+x ! -name '*.so' -print0 |
            xargs -0 -n 1 objdump -T | grep -o 'GLIBC_[0-9.]*' |
            sort -V | uniq | tail -1
          (cd "$P" && find . -type f ! -name SHA256SUMS -print0 | sort -z |
            xargs -0 sha256sum > SHA256SUMS)
          tar -C "$PACKAGE" -czf "$PACKAGE.tar.gz" janas
          sha256sum "$PACKAGE.tar.gz" > "$PACKAGE.tar.gz.sha256"
          cat "$PACKAGE.tar.gz.sha256"

      - name: Pack the diagnostics
        run: |
          set -euo pipefail
          # vkcheck and gpu_check alone, for a tester who only has to tell
          # whether the GPU works: no model, no engine, a few megabytes
          B=bin/x86_64-linux
          D="$DIAG/janas-diag"
          mkdir -p "$D"
          install -m 755 "$B/vkcheck" "$B/gpu_check" "$D/"
          install -m 644 dist/README-diag.md "$D/README.md"
          install -m 644 LICENSE "$D/"
          (cd "$D" && find . -type f ! -name SHA256SUMS -print0 | sort -z |
            xargs -0 sha256sum > SHA256SUMS)
          tar -C "$DIAG" -czf "$DIAG.tar.gz" janas-diag
          sha256sum "$DIAG.tar.gz" > "$DIAG.tar.gz.sha256"
          cat "$DIAG.tar.gz.sha256"

      - name: Keep the package (run by hand)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: |
            ${{ env.PACKAGE }}.tar.gz
            ${{ env.PACKAGE }}.tar.gz.sha256
            ${{ env.DIAG }}.tar.gz
            ${{ env.DIAG }}.tar.gz.sha256

      - name: Publish the release (a tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$PACKAGE.tar.gz" "$PACKAGE.tar.gz.sha256" \
            "$DIAG.tar.gz" "$DIAG.tar.gz.sha256" \
            --title "Janas $GITHUB_REF_NAME" \
            --notes "Janas for Linux x86-64 (Ubuntu 22.04, Debian 12 and later): janas-linux-x86_64.tar.gz; for Windows 10 and 11 x86-64: janas-windows-x86_64.zip. Only the GPU checks (vkcheck, gpu_check), to tell whether a GPU computes what the CPU does: janas-diag-linux-x86_64.tar.gz, janas-diag-windows-x86_64.zip. Unpack it and start: janas-get list, then janas-chat <model>. What changed: ChangeLog.md. The SHA-256 of every file: SHA256SUMS in the package."

  # Windows x86-64: the same sources built with MinGW-w64 on Linux (a
  # newer Ubuntu: the C library does not matter for Windows, the MinGW
  # headers do), then tested on Windows, then packed.
  windows-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: MinGW-w64, the shaders' compiler and the Vulkan headers
        run: |
          set -euo pipefail
          # no question may wait for an answer (needrestart asks one)
          export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a
          sudo -E apt-get update -q
          sudo -E apt-get install -y -q --no-install-recommends \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          mkdir -p "$RUNNER_TEMP/khronos"
          cd "$RUNNER_TEMP/khronos"
          curl -fsSL -o glslang.tar.gz \
            "https://github.com/KhronosGroup/glslang/releases/download/$GLSLANG_VERSION/glslang-$GLSLANG_VERSION-linux-x86_64-release.tar.gz"
          echo "$GLSLANG_SHA256  glslang.tar.gz" | sha256sum -c -
          mkdir glslang && tar xzf glslang.tar.gz -C glslang
          echo "$RUNNER_TEMP/khronos/glslang/bin" >> "$GITHUB_PATH"
          git clone -q --depth 1 --branch "$VULKAN_HEADERS_TAG" \
            https://github.com/KhronosGroup/Vulkan-Headers.git
          test "$(git -C Vulkan-Headers rev-parse HEAD)" = "$VULKAN_HEADERS_COMMIT"
          echo "CPATH=$RUNNER_TEMP/khronos/Vulkan-Headers/include" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -euo pipefail
          x86_64-w64-mingw32-gcc --version | head -1
          JANAS_OS=windows ./build.sh release build 2>&1 | tee build.log
          if grep -q "building without GPU support" build.log; then
            echo "the build left the GPU out"; exit 1
          fi
          # nothing but Windows's own DLLs
          for f in bin/x86_64-windows/*.exe bin/x86_64-windows/*.dll; do
            x86_64-w64-mingw32-objdump -p "$f" | grep "DLL Name" |
              grep -v -i -E 'kernel32|msvcrt|ws2_32|bcrypt|crypt32|powrprof|advapi32|iphlpapi|ole32|wevtapi|wlanapi|shell32|psapi|user32|setupapi' &&
              { echo "$f needs a DLL Windows does not have"; exit 1; } || true
          done

      - uses: actions/upload-artifact@v7
        with:
          name: windows-bin
          path: bin/x86_64-windows/

  windows-test:
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: windows-bin
          path: bin/x86_64-windows

      - name: Test
        shell: pwsh
        run: |
          $failed = @()
          foreach ($t in Get-ChildItem bin\x86_64-windows\test_*.exe) {
            Write-Host "RUN $($t.Name)"
            & $t.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $t.Name }
          }
          if ($failed.Count -gt 0) { Write-Host "failed: $failed"; exit 1 }

  windows-package:
    needs: [linux-x86_64, windows-build, windows-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WPACKAGE: janas-windows-x86_64
      WDIAG: janas-diag-windows-x86_64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: windows-bin
          path: bin/x86_64-windows

      - name: Pack
        run: |
          set -euo pipefail
          B=bin/x86_64-windows
          P="$WPACKAGE/janas"
          mkdir -p "$P/services" "$P/lib" "$P/include/janas" "$P/docs"
          for f in janas-chat janas-server janas-get janas-setup janas-bench janas-mcp \
                   gguf2jns jns_planes hf2jns_mtp jns_check vkcheck gpu_check; do
            install -m 755 "$B/$f.exe" "$P/"
          done
          for s in src/services/*/; do
            s=$(basename "$s")
            [ "$s" = common ] && continue
            # a service not built for Windows yet (janas-files) stays out
            [ -f "$B/janas-$s.exe" ] || continue
            install -m 755 "$B/janas-$s.exe" "$P/services/"
            install -m 644 "src/services/$s/README.md" "$P/services/janas-$s.md"
          done
          sed -E 's#\(([a-z]+)/README\.md\)#(janas-\1.md)#g' \
            src/services/README.md > "$P/services/README.md"
          install -m 755 "$B/libjanas_llm.dll" "$B/libjanas_mcp.dll" "$P/lib/"
          install -m 644 "$B/libjanas_llm.dll.a" "$B/libjanas_mcp.dll.a" "$P/lib/"
          install -m 644 include/janas/* "$P/include/janas/"
          install -m 644 docs/*.md "$P/docs/"
          install -m 644 dist/README-windows.md "$P/README.md"
          install -m 644 LICENSE ChangeLog.md MODELS.md "$P/"
          if find "$P" -type f \( -name '*.sh' -o -name '*.py' -o -name '*.bat' \) | grep -q .; then
            echo "a script in the package"; exit 1
          fi
          (cd "$P" && find . -type f ! -name SHA256SUMS -print0 | sort -z |
            xargs -0 sha256sum > SHA256SUMS)
          (cd "$WPACKAGE" && zip -q -r -X "../$WPACKAGE.zip" janas)
          sha256sum "$WPACKAGE.zip" > "$WPACKAGE.zip.sha256"
          cat "$WPACKAGE.zip.sha256"
          # the diagnostics alone, as for Linux
          D="$WDIAG/janas-diag"
          mkdir -p "$D"
          install -m 755 "$B/vkcheck.exe" "$B/gpu_check.exe" "$D/"
          install -m 644 dist/README-diag.md "$D/README.md"
          install -m 644 LICENSE "$D/"
          (cd "$D" && find . -type f ! -name SHA256SUMS -print0 | sort -z |
            xargs -0 sha256sum > SHA256SUMS)
          (cd "$WDIAG" && zip -q -r -X "../$WDIAG.zip" janas-diag)
          sha256sum "$WDIAG.zip" > "$WDIAG.zip.sha256"
          cat "$WDIAG.zip.sha256"

      - name: Keep the package (run by hand)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.WPACKAGE }}
          path: |
            ${{ env.WPACKAGE }}.zip
            ${{ env.WPACKAGE }}.zip.sha256
            ${{ env.WDIAG }}.zip
            ${{ env.WDIAG }}.zip.sha256

      - name: Add it to the release (a tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "$WPACKAGE.zip" "$WPACKAGE.zip.sha256" \
            "$WDIAG.zip" "$WDIAG.zip.sha256"

  # The wiki, made from the same pages as the repository: README.md becomes
  # Home, each docs/*.md a page named after its title. It is never edited
  # by hand: every tag writes it again whole, so it cannot drift from the
  # release. Links between the pages become the wiki's own; links to the
  # sources point to the tag's files on GitHub.
  wiki:
    needs: linux-x86_64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Write the wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/wiki"
          git clone -q "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.wiki.git" "$W"
          find "$W" -maxdepth 1 -name '*.md' -delete
          BLOB="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME"
          # the order of the README's list, then any page not in it
          ORDER="features models chat library serving code-completion tools hardware"
          for f in docs/*.md; do
            n=$(basename "$f" .md)
            case " $ORDER " in *" $n "*) ;; *) ORDER="$ORDER $n" ;; esac
          done
          # a page's name: its title, spaces made dashes
          PAGES=()
          for n in $ORDER; do
            t=$(head -1 "docs/$n.md" | sed -E 's/^# //')
            PAGES+=("$n=${t// /-}")
          done
          names() {  # @@name@@ -> the page's name
            for p in "${PAGES[@]}"; do
              printf 's#@@%s@@#%s#g\n' "${p%%=*}" "${p#*=}"
            done
          }
          # Home: docs/x.md -> the page, other files -> the tag's sources
          sed -E -e 's#\]\(docs/([a-z-]+)\.md(\#[^)]*)?\)#](@@\1@@\2)#g' \
                 -e "s#\\]\\(([A-Za-z][^):@]*)\\)#](${BLOB}/\\1)#g" README.md |
            sed -E -f <(names) > "$W/Home.md"
          for n in $ORDER; do
            t=$(head -1 "docs/$n.md" | sed -E 's/^# //')
            tail -n +2 "docs/$n.md" | sed -E '1{/^$/d}' |
              sed -E -e 's#\]\(\.\./README\.md(\#[^)]*)?\)#](Home\1)#g' \
                     -e "s#\\]\\(\\.\\./([^)]*)\\)#](${BLOB}/\\1)#g" \
                     -e 's#\]\(([a-z-]+)\.md(\#[^)]*)?\)#](@@\1@@\2)#g' |
              sed -E -f <(names) > "$W/${t// /-}.md"
          done
          # no link may be left pointing at a file the wiki does not have
          if grep -n -E '\]\([^):]*\.md(#[^)]*)?\)|@@' "$W"/*.md; then
            echo "a link the wiki cannot follow"; exit 1
          fi
          {
            echo "**[Home](Home)**"
            echo
            for p in "${PAGES[@]}"; do
              v=${p#*=}
              echo "- [${v//-/ }]($v)"
            done
          } > "$W/_Sidebar.md"
          echo "Written from the repository's README.md and docs/ at [$GITHUB_REF_NAME](https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME): changes go there, not here." > "$W/_Footer.md"
          cd "$W"
          git add -A
          if git diff --cached --quiet; then echo "the wiki is already up to date"; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "The wiki of $GITHUB_REF_NAME"
          git push -q origin HEAD
