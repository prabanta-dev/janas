#
# Whether GitHub's Macs give a program Metal, before Janas's Metal backend
# is written: the devices listed, a buffer shared with the CPU made from
# memory the program holds (as Janas would hand the GPU its mapped model),
# a small compute kernel compiled at run time and run on it, its result
# checked. Run by hand, or by a push to port/metal.
name: metal-probe

on:
  push:
    branches: ['port/metal']
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Metal
        run: |
          set -euo pipefail
          cat > probe.m <<'EOF'
          #import <Foundation/Foundation.h>
          #import <Metal/Metal.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/mman.h>

          static NSString *const src =
              @"#include <metal_stdlib>\n"
               "using namespace metal;\n"
               "kernel void axpy(device const float *x [[buffer(0)]],\n"
               "                 device float *y [[buffer(1)]],\n"
               "                 uint i [[thread_position_in_grid]]) {\n"
               "  y[i] = fma(2.0f, x[i], y[i]);\n"
               "}\n";

          int main(void) {
            @autoreleasepool {
              NSArray<id<MTLDevice>> *all = MTLCopyAllDevices();
              printf("devices: %lu\n", (unsigned long)all.count);
              for (id<MTLDevice> d in all)
                printf("  %s: unified memory %d, recommended working set %.1f GB, "
                       "Apple7 family %d, Apple9 family %d\n",
                       d.name.UTF8String, (int)d.hasUnifiedMemory,
                       d.recommendedMaxWorkingSetSize / 1e9,
                       (int)[d supportsFamily:MTLGPUFamilyApple7],
                       (int)[d supportsFamily:MTLGPUFamilyApple9]);
              id<MTLDevice> dev = MTLCreateSystemDefaultDevice();
              if (!dev) { printf("no default device\n"); return 1; }
              NSError *err = nil;
              id<MTLLibrary> lib = [dev newLibraryWithSource:src options:nil error:&err];
              if (!lib) { printf("compile: %s\n", err.description.UTF8String); return 1; }
              id<MTLComputePipelineState> ps =
                  [dev newComputePipelineStateWithFunction:[lib newFunctionWithName:@"axpy"]
                                                     error:&err];
              if (!ps) { printf("pipeline: %s\n", err.description.UTF8String); return 1; }
              /* the program's own pages, page aligned, handed over as they are */
              const size_t n = 1 << 20, bytes = n * sizeof(float);
              float *x = mmap(NULL, bytes, PROT_READ | PROT_WRITE, MAP_ANON | MAP_PRIVATE, -1, 0);
              float *y = mmap(NULL, bytes, PROT_READ | PROT_WRITE, MAP_ANON | MAP_PRIVATE, -1, 0);
              for (size_t i = 0; i < n; i++) { x[i] = (float)(i % 1024) * 0.5f; y[i] = 1.0f; }
              id<MTLBuffer> bx = [dev newBufferWithBytesNoCopy:x length:bytes
                                  options:MTLResourceStorageModeShared deallocator:nil];
              id<MTLBuffer> by = [dev newBufferWithBytesNoCopy:y length:bytes
                                  options:MTLResourceStorageModeShared deallocator:nil];
              printf("no-copy buffers: %s\n", bx && by ? "yes" : "NO");
              if (!bx || !by) return 1;
              id<MTLCommandQueue> q = [dev newCommandQueue];
              NSDate *t0 = [NSDate date];
              for (int rep = 0; rep < 10; rep++) {
                id<MTLCommandBuffer> cb = [q commandBuffer];
                id<MTLComputeCommandEncoder> e = [cb computeCommandEncoder];
                [e setComputePipelineState:ps];
                [e setBuffer:bx offset:0 atIndex:0];
                [e setBuffer:by offset:0 atIndex:1];
                [e dispatchThreads:MTLSizeMake(n, 1, 1)
                    threadsPerThreadgroup:MTLSizeMake(ps.maxTotalThreadsPerThreadgroup, 1, 1)];
                [e endEncoding];
                [cb commit];
                [cb waitUntilCompleted];
                if (cb.error) { printf("run: %s\n", cb.error.description.UTF8String); return 1; }
              }
              double s = -[t0 timeIntervalSinceNow];
              size_t bad = 0;
              for (size_t i = 0; i < n; i++)
                if (y[i] != 1.0f + 20.0f * ((float)(i % 1024) * 0.5f)) bad++;
              printf("kernel: 10 runs on %zu floats, %zu wrong, %.2f ms each\n", n, bad, s * 100.0);
              return bad ? 1 : 0;
            }
          }
          EOF
          clang -O2 -fobjc-arc -framework Foundation -framework Metal probe.m -o probe
          sysctl -n machdep.cpu.brand_string hw.memsize
          ./probe
